<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuron Studio — Coming Soon</title>
  <meta name="description" content="Nuron Studio is coming soon." />
  <meta name="theme-color" content="#f4efe6" />
  <meta property="og:title" content="Nuron Studio — Coming Soon" />
  <meta property="og:description" content="Nuron Studio is coming soon." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23070707' stroke='%23c9a96e' stroke-width='1.5'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Georgia,serif' font-size='30' fill='%23c9a96e'%3EN%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
  <script>try{var t=localStorage.getItem("nuron-theme");if(t==="dark"||t==="light"){document.documentElement.setAttribute("data-theme",t);}}catch(e){}</script>

  <style>
    :root {
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Jost', 'Helvetica Neue', Arial, sans-serif;
      --ease: cubic-bezier(0.19, 1, 0.22, 1);
    }

    /* ---- Light (default) ---- */
    :root, :root[data-theme="light"] {
      --bg-a: #fbf8f1;
      --bg-b: #f4efe6;
      --fg: #141210;
      --gold: #9c7b4a;
      --gold-2: #c9a96e;
      --stroke: rgba(156, 123, 74, 0.85);
      --fill-a: #c9a96e; --fill-b: #9c7b4a; --fill-c: #6e5430;
      --line: rgba(20, 18, 16, 0.35);
      --placeholder: rgba(20, 18, 16, 0.3);
      --dim: rgba(20, 18, 16, 0.5);
      --hover: #141210;
      --toggle-fill: #141210;
    }

    /* ---- Dark ---- */
    :root[data-theme="dark"] {
      --bg-a: rgba(201, 169, 110, 0.08);
      --bg-b: #070707;
      --fg: #f3ecdf;
      --gold: #c9a96e;
      --gold-2: #e9d3a3;
      --stroke: rgba(201, 169, 110, 0.75);
      --fill-a: #f0dcb0; --fill-b: #c9a96e; --fill-c: #9c7b4a;
      --line: rgba(201, 169, 110, 0.35);
      --placeholder: rgba(243, 236, 223, 0.28);
      --dim: rgba(243, 236, 223, 0.5);
      --hover: #e9d3a3;
      --toggle-fill: #e9d3a3;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: radial-gradient(ellipse 65% 55% at 50% 50%, var(--bg-a), transparent 70%), var(--bg-b);
      color: var(--fg);
      font-family: var(--sans);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      transition: background 0.8s ease, color 0.8s ease;
    }

    main {
      min-height: 100svh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px 24px;
    }

    .fade { opacity: 0; transform: translateY(12px); animation: fade 1.8s var(--ease) forwards; }
    .fade:nth-child(2) { animation-delay: 0.3s; }
    .fade:nth-child(3) { animation-delay: 0.6s; }
    .fade:nth-child(4) { animation-delay: 1s; }
    @keyframes fade { to { opacity: 1; transform: none; } }

    .brand {
      font-family: var(--serif); font-weight: 300;
      font-size: clamp(22px, 2.6vw, 30px); letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--fg); padding-left: 0.3em;
      transition: color 0.8s ease;
    }
    .brand em { font-style: italic; color: var(--gold); transition: color 0.8s ease; }

    .coming {
      margin-top: 64px; font-size: 11px; letter-spacing: 0.7em; text-transform: uppercase;
      color: var(--gold); padding-left: 0.7em; transition: color 0.8s ease;
    }

    .soon {
      font-family: var(--serif); font-weight: 300;
      font-size: clamp(110px, 26vw, 360px); line-height: 0.85; letter-spacing: 0.04em; text-transform: uppercase;
      color: transparent; -webkit-text-stroke: 1px var(--stroke);
      position: relative; margin-top: 6px;
      transition: -webkit-text-stroke 0.8s ease;
    }
    .soon::after {
      content: 'Soon'; position: absolute; inset: 0; -webkit-text-stroke: 0;
      background: linear-gradient(180deg, var(--fill-a), var(--fill-b) 55%, var(--fill-c));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      opacity: 0; animation: fill 8s ease-in-out infinite 2s;
    }
    @keyframes fill { 0%, 100% { opacity: 0; } 50% { opacity: 0.85; } }

    .invite { margin-top: 56px; width: min(400px, 100%); }
    .invite form {
      display: flex; align-items: center;
      border-bottom: 1px solid var(--line); transition: border-color 0.5s ease;
    }
    .invite form:focus-within { border-color: var(--hover); }
    .invite input {
      flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
      padding: 14px 4px; color: var(--fg);
      font-family: var(--serif); font-size: 21px; font-weight: 300;
      transition: color 0.8s ease;
    }
    .invite input::placeholder { color: var(--placeholder); font-style: italic; }
    .invite button {
      background: transparent; border: 0; color: var(--gold); cursor: pointer;
      font-family: var(--sans); font-size: 11px; letter-spacing: 0.4em; text-transform: uppercase;
      padding: 14px 0 14px 18px; transition: color 0.4s ease;
    }
    .invite button:hover { color: var(--hover); }
    .invite .thanks {
      display: none; padding: 14px 0;
      font-family: var(--serif); font-style: italic; font-size: 21px; color: var(--gold);
      border-bottom: 1px solid var(--line);
    }
    .invite.is-done form { display: none; }
    .invite.is-done .thanks { display: block; animation: fade 1.2s var(--ease); }

    footer {
      position: fixed; left: 0; right: 0; bottom: 28px;
      text-align: center; font-size: 10px; letter-spacing: 0.35em; text-transform: uppercase;
      color: var(--dim); opacity: 0; animation: fade 1.8s var(--ease) 1.2s forwards;
      transition: color 0.8s ease;
    }

    /* ---- Theme toggle ---- */
    .theme-toggle {
      position: fixed; top: 28px; right: 28px; z-index: 10;
      width: 40px; height: 40px; border-radius: 50%;
      background: transparent; border: 0; cursor: pointer;
      display: grid; place-items: center;
      opacity: 0; animation: fade 1.8s var(--ease) 1.4s forwards;
    }
    .theme-toggle span {
      width: 14px; height: 14px; border-radius: 50%;
      border: 1px solid var(--gold);
      background: linear-gradient(90deg, var(--toggle-fill) 50%, transparent 50%);
      transition: transform 0.8s var(--ease), background 0.8s ease, border-color 0.8s ease;
    }
    :root[data-theme="dark"] .theme-toggle span { transform: rotate(180deg); }
    .theme-toggle:hover span { transform: scale(1.15); }
    :root[data-theme="dark"] .theme-toggle:hover span { transform: rotate(180deg) scale(1.15); }
    .theme-toggle:focus-visible { outline: 1px solid var(--gold); outline-offset: 4px; }

    @media (max-width: 640px) {
      .theme-toggle { top: 16px; right: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fade, footer, .theme-toggle { animation: none; opacity: 1; transform: none; }
      .soon::after { animation: none; opacity: 0.5; }
    }
  </style>
</head>
<body>

  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme" title="Switch theme"><span></span></button>

  <main>
    <div class="brand fade">Nuron <em>Studio</em></div>
    <div class="coming fade">Coming</div>
    <div class="soon fade" aria-label="Soon">Soon</div>

    <section class="invite fade" id="invite">
      <form name="invitation" method="POST" action="/" data-netlify="true" data-netlify-honeypot="bot-field" id="inviteForm" novalidate>
        <input type="hidden" name="form-name" value="invitation" />
        <p style="display:none"><label>Leave empty: <input name="bot-field" /></label></p>
        <input type="email" name="email" placeholder="your@address.com" autocomplete="email" required aria-label="Email address" />
        <button type="submit">Notify me</button>
      </form>
      <div class="thanks">Thank you. You will hear from us first.</div>
    </section>
  </main>

  <footer>nuronstudio.com</footer>

  <script>
    (function () {
      var root = document.documentElement;
      var toggle = document.getElementById("themeToggle");
      var meta = document.querySelector('meta[name="theme-color"]');

      function apply(theme) {
        root.setAttribute("data-theme", theme);
        toggle.setAttribute("aria-label", theme === "dark" ? "Switch to light theme" : "Switch to dark theme");
        if (meta) meta.setAttribute("content", theme === "dark" ? "#070707" : "#f4efe6");
        try { localStorage.setItem("nuron-theme", theme); } catch (e) {}
      }
      apply(root.getAttribute("data-theme") === "dark" ? "dark" : "light");
      toggle.addEventListener("click", function () {
        apply(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
      });

      var form = document.getElementById("inviteForm");
      var invite = document.getElementById("invite");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var email = form.email.value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { form.email.focus(); return; }
        fetch("/", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams(new FormData(form)).toString()
        }).catch(function () {}).finally(function () { invite.classList.add("is-done"); });
      });
    })();
  </script>
</body>
</html>
