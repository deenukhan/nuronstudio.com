<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuron Studio — Coming Soon</title>
  <meta name="description" content="Nuron Studio is coming soon." />
  <meta name="theme-color" content="#070707" />
  <meta property="og:title" content="Nuron Studio — Coming Soon" />
  <meta property="og:description" content="Nuron Studio is coming soon." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23070707' stroke='%23c9a96e' stroke-width='1.5'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Georgia,serif' font-size='30' fill='%23c9a96e'%3EN%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #070707;
      --gold: #c9a96e;
      --gold-bright: #e9d3a3;
      --ivory: #f3ecdf;
      --ivory-dim: rgba(243, 236, 223, 0.5);
      --serif: 'Cormorant Garamond', 'Times New Roman', serif;
      --sans: 'Jost', 'Helvetica Neue', Arial, sans-serif;
      --ease: cubic-bezier(0.19, 1, 0.22, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background:
        radial-gradient(ellipse 60% 50% at 50% 50%, rgba(201, 169, 110, 0.07), transparent 70%),
        var(--ink);
      color: var(--ivory);
      font-family: var(--sans);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    main {
      min-height: 100svh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 60px 24px;
    }

    .fade { opacity: 0; transform: translateY(14px); animation: fade 1.8s var(--ease) forwards; }
    .fade:nth-child(2) { animation-delay: 0.3s; }
    .fade:nth-child(3) { animation-delay: 0.6s; }
    .fade:nth-child(4) { animation-delay: 0.9s; }
    @keyframes fade { to { opacity: 1; transform: translateY(0); } }

    h1 {
      font-family: var(--serif); font-weight: 300;
      font-size: clamp(44px, 9vw, 120px);
      line-height: 1; letter-spacing: 0.08em; text-transform: uppercase;
      background: linear-gradient(180deg, #fbf5e8 0%, #efe4cc 50%, #c9b58d 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    h1 em {
      font-style: italic; letter-spacing: 0.03em;
      background: linear-gradient(180deg, #f0dcb0 0%, #c9a96e 55%, #9c7b4a 100%);
      -webkit-background-clip: text; background-clip: text;
    }

    .rule {
      width: 1px; height: 48px; margin: 36px auto 30px;
      background: linear-gradient(180deg, transparent, var(--gold), transparent);
    }

    p.soon {
      font-size: 12px; letter-spacing: 0.5em; text-transform: uppercase;
      color: var(--gold);
      padding-left: 0.5em;
    }

    .invite { margin-top: 56px; width: min(420px, 100%); }
    .invite form {
      display: flex; align-items: center;
      border-bottom: 1px solid rgba(201, 169, 110, 0.35);
      transition: border-color 0.5s ease;
    }
    .invite form:focus-within { border-color: var(--gold-bright); }
    .invite input {
      flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
      padding: 14px 4px; color: var(--ivory);
      font-family: var(--serif); font-size: 21px; font-weight: 300;
    }
    .invite input::placeholder { color: rgba(243, 236, 223, 0.28); font-style: italic; }
    .invite button {
      background: transparent; border: 0; color: var(--gold); cursor: pointer;
      font-family: var(--sans); font-size: 11px; letter-spacing: 0.4em; text-transform: uppercase;
      padding: 14px 0 14px 18px; transition: color 0.4s ease;
    }
    .invite button:hover { color: var(--gold-bright); }
    .invite .thanks {
      display: none; padding: 14px 0;
      font-family: var(--serif); font-style: italic; font-size: 21px; color: var(--gold-bright);
      border-bottom: 1px solid rgba(201, 169, 110, 0.35);
    }
    .invite.is-done form { display: none; }
    .invite.is-done .thanks { display: block; animation: fade 1.2s var(--ease); }

    footer {
      position: fixed; left: 0; right: 0; bottom: 28px;
      text-align: center; font-size: 10px; letter-spacing: 0.35em; text-transform: uppercase;
      color: var(--ivory-dim); opacity: 0; animation: fade 1.8s var(--ease) 1.2s forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .fade, footer { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

  <main>
    <h1 class="fade">Nuron <em>Studio</em></h1>
    <div class="rule fade"></div>
    <p class="soon fade">Coming Soon</p>

    <section class="invite fade" id="invite">
      <form name="invitation" method="POST" action="/" data-netlify="true" data-netlify-honeypot="bot-field" id="inviteForm" novalidate>
        <input type="hidden" name="form-name" value="invitation" />
        <p style="display:none"><label>Leave empty: <input name="bot-field" /></label></p>
        <input type="email" name="email" placeholder="your@address.com" autocomplete="email" required aria-label="Email address" />
        <button type="submit">Notify me</button>
      </form>
      <div class="thanks">Thank you. You will hear from us first.</div>
    </section>
  </main>

  <footer>nuronstudio.com</footer>

  <script>
    (function () {
      const form = document.getElementById('inviteForm');
      const invite = document.getElementById('invite');
      form.addEventListener('submit', e => {
        e.preventDefault();
        const email = form.email.value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { form.email.focus(); return; }
        fetch('/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams(new FormData(form)).toString()
        }).catch(() => {}).finally(() => invite.classList.add('is-done'));
      });
    })();
  </script>
</body>
</html>
