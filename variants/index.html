<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="robots" content="noindex" />
  <title>Nuron Studio — Variations</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#070707;color:#f3ecdf;font-family:'Jost',sans-serif;font-weight:300;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;text-align:center}
    h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:34px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px}
    p{font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:#c9a96e;margin-bottom:44px}
    ul{list-style:none;display:grid;gap:14px;width:min(420px,100%)}
    a{display:flex;justify-content:space-between;padding:16px 4px;border-bottom:1px solid rgba(201,169,110,.3);color:#f3ecdf;text-decoration:none;font-family:'Cormorant Garamond',serif;font-size:22px;transition:border-color .4s}
    a:hover{border-color:#e9d3a3}
    a span{font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:#c9a96e;align-self:center}
  </style>
</head>
<body>
  <h1>Nuron Studio</h1>
  <p>Coming Soon — five variations</p>
  <ul>
    <li><a href="/">Current <span>Minimal</span></a></li>
    <li><a href="/variants/v1/">One <span>Ivory</span></a></li>
    <li><a href="/variants/v2/">Two <span>Editorial</span></a></li>
    <li><a href="/variants/v3/">Three <span>Monogram</span></a></li>
    <li><a href="/variants/v4/">Four <span>Split</span></a></li>
    <li><a href="/variants/v5/">Five <span>Outline</span></a></li>
  </ul>
</body>
</html>
